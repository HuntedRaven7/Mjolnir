# Rehydrate pristine /etc defaults into the volatile tmpfs each boot.
L /etc/os-release - - - - ../usr/lib/os-release
L /etc/resolv.conf - - - - ../run/systemd/resolve/resolv.conf
C /etc/nsswitch.conf - - - -
C /etc/hosts - - - -
C /etc/protocols - - - -
C /etc/services - - - -
C /etc/pam.d - - - -
# cryptsetup-generator must find the LUKS mapping again after switch-root.
C /etc/crypttab - - - -
# systemd-stub exposes the signed PCR artifacts in the initrd; keep them at the
# paths systemd-cryptenroll and systemd-cryptsetup search by default.
C /run/systemd/tpm2-pcr-signature.json - - - - /.extra/tpm2-pcr-signature.json
C /run/systemd/tpm2-pcr-public-key.pem - - - - /.extra/tpm2-pcr-public-key.pem

# Ephemeral mount points for persistent state (native .mount units in /usr).
d /etc/NetworkManager/system-connections 0700 root root -
d /etc/kubernetes 0700 root root -
d /var/lib/mjolnir 0755 root root -
d /var/lib/containerd 0700 root root -
d /var/lib/kubelet 0700 root root -
d /var/lib/cni 0755 root root -
d /var/lib/mjolnir/var/lib/etcd 0700 root root -
d /var/log/journal 2755 root systemd-journal -
