[Partition]
# EFI System Partition for systemd-boot. With --run-repart bootc only
# generates the root definition; the image must define its own ESP or the
# composefs bootloader install fails with "ESP partition not found".
Type=esp
Label=EFI-SYSTEM
Format=vfat
# Matches bootc's composefs layout (CFS_EFIPN_SIZE_MB) and the previous
# sfdisk layout used by install to-disk.
SizeMinBytes=2G
SizeMaxBytes=2G
