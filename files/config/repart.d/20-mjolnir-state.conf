[Partition]
Type=state
Label=MjolnirState
Format=btrfs
SizeMinBytes=2G
SizeMaxBytes=16G
# Factory reset wipes and recreates this partition in the initrd.
FactoryReset=yes
# Create a LUKS2 superblock on first boot. With no KeyFile= and no --key-file=
# passed by systemd-repart.service, the initial slot uses the empty key;
# mjolnir-state-enroll.service replaces it with a TPM2 slot bound to PCR 7 and
# a signed PCR 11 policy. No key material lives in the image or repository.
Encrypt=key-file
