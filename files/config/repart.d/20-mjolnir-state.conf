[Partition]
# `state` is not a systemd-repart partition type identifier and makes repart
# fail with "Failed to parse partition type". linux-generic is the valid type
# for an explicitly mounted encrypted data partition here. A DPS type such as
# var or home would make systemd-gpt-auto-generator mount it at the wrong path.
Type=linux-generic
Label=MjolnirState
Format=btrfs
SizeMinBytes=2G
SizeMaxBytes=16G
# Factory reset wipes and recreates this partition in the initrd.
FactoryReset=yes
# Create a LUKS2 superblock on first boot. With no KeyFile= and no --key-file=
# passed by systemd-repart.service, the initial slot uses the empty key;
# mjolnir-state-enroll.service replaces it with a TPM2 slot bound to PCR 7 and
# a signed PCR 11 policy. No key material lives in the image or repository.
Encrypt=key-file
