# Build-time dracut configuration. These binaries are folded into the
# generated initramfs; no script is shipped to the target.
# The systemd TPM2 token plugin pulls in its tpm2-tss library dependencies via
# normal ELF dependency resolution, so no optional dracut module is referenced.
add_dracutmodules+=" crypt "
install_items+=" /etc/crypttab "
install_optional_items+=" /usr/lib/cryptsetup/libcryptsetup-token-systemd-tpm2.so "
# A PCR policy miss fails cryptsetup in the initramfs, so the failure report
# and its OnFailure drop-in must be present before switch-root. echo is a
# compiled binary; no shell or interpreter enters the initramfs.
install_items+=" /usr/lib/systemd/system/mjolnir-state-unseal-failed.service "
install_items+=" /usr/lib/systemd/system/systemd-cryptsetup@mjolnir-state.service.d/10-mjolnir-failure.conf "
install_items+=" /usr/bin/echo "
