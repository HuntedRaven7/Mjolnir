[install]
bootloader = "systemd"
# systemd-repart applies repart.d definitions automatically during install;
# the old `run-repart` key is rejected by current bootc versions.

[install.filesystem.root]
type = "btrfs"
# ESP and xbootldr filesystems are set by bootc itself. Declaring them here
# makes bootc install fail with "unknown field `esp`, expected `root`".
