apiVersion: v1
kind: ServiceAccount
metadata:
  name: mjolnir-fleet
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mjolnir-fleet-publisher
rules:
  - apiGroups: ["mjolnir.kubestellar.io"]
    resources: ["mjolnirnodes"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["mjolnir.kubestellar.io"]
    resources: ["mjolnirnodes/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mjolnir-fleet-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mjolnir-fleet-publisher
subjects:
  - kind: ServiceAccount
    name: mjolnir-fleet
    namespace: kube-system
