apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mjolnirnodes.mjolnir.kubestellar.io
spec:
  group: mjolnir.kubestellar.io
  names:
    kind: MjolnirNode
    listKind: MjolnirNodeList
    plural: mjolnirnodes
    singular: mjolnirnode
    shortNames: [mjn]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Version
          type: string
          jsonPath: .status.version
        - name: Update
          type: boolean
          jsonPath: .status.updateAvailable
        - name: Reboot
          type: boolean
          jsonPath: .status.rebootRequired
        - name: LastCheck
          type: date
          jsonPath: .status.lastCheck
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                role:
                  type: string
                  enum: [control-plane, worker]
                varlinkEndpoint:
                  type: string
            status:
              type: object
              properties:
                image: { type: string }
                version: { type: string }
                updateAvailable: { type: boolean }
                pendingDeployment: { type: string }
                rebootRequired: { type: boolean }
                rebootLock: { type: boolean }
                rebootDeferred: { type: boolean }
                lastCheck: { type: string, format: date-time }
                attestation:
                  type: object
                  properties:
                    method: { type: string, enum: [tpm2, software, none] }
                    bootId: { type: string }
                    machineId: { type: string }
                    pcrBank: { type: string }
                    pcrValues:
                      type: object
                      additionalProperties: { type: string }
                    eventLogHashSha256: { type: string }
                    uki:
                      type: object
                      properties:
                        peHashSha256: { type: string }
                    usrVerityRootHash: { type: string }
                wifi:
                  type: object
                  properties:
                    ssid: { type: string }
                    interface: { type: string }
                    state: { type: string }
                    signal: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
