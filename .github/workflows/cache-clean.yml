name: cache-clean

# The cache package gains a tag on every build (`latest` plus a graph key), so
# prune it far more aggressively than the image. Keeping the two newest tagged
# entries covers exactly what a restore looks for.
on:
  schedule:
    - cron: "31 3 * * 1"   # weekly, Monday 03:31 UTC
  workflow_dispatch:

permissions: {}

jobs:
  cache:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up BuildStream cache package
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@d8f31e9ac688e15883c4a673aa389ac7cf76beab # v1
        with:
          packages: mjolnir-cache
          older-than: 2 days
          keep-n-tagged: 2
          keep-n-untagged: 0
          github-token: ${{ secrets.GITHUB_TOKEN }}
