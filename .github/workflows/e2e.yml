name: e2e

# Boot/health/provenance gate, adapted from projectbluefin/testsuite's wrapper
# pattern. Drives our shell-less image over the serial console + Varlink instead
# of injecting an SSH user into a disposable disk copy.
#
# Runs after build has pushed :testing, not on the push itself: the two
# workflows used to start together, so e2e tried to pull an image that the
# build had not produced yet. On PRs the image is built locally in this job so
# the boot test can act as a required status check.
on:
  # PRs have no published image, so build it locally in the job below. This
  # makes the boot test a real gate on changes to the image.
  pull_request:
    branches: [testing]
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [testing]
  workflow_dispatch:
    inputs:
      image:
        description: "Image ref to test"
        type: string
        default: ghcr.io/huntedraven7/mjolnir:testing
      local_build:
        description: "Build the image locally instead of pulling :testing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: boot + health + provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    if: >-
      (github.event_name == 'pull_request' || inputs.local_build) ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      PODMAN: "sudo podman"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Test the harness from the commit that produced the image.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cosign

      # PR builds do not push an image, so build and load it locally.
      - name: Set up runner for local image build (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          install-tools: '["just", "cosign", "oras"]'

      # Must run AFTER setup-runner: its disk cleanup deletes
      # /opt/hostedtoolcache, which is where setup-go installs Go. Installing
      # Go earlier means the toolchain is gone by the time the installer is
      # compiled below.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
          cache: false

      - name: Normalize registry owner (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        run: echo "IMAGE_OWNER=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Restore BuildStream cache (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        continue-on-error: true
        env:
          BST_CACHE_REF: ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir-cache
          BST_CACHE_KEY: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'include/versions.yml', 'elements/freedesktop-sdk.bst') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: just cache-pull

      # Deleting local artifacts is not enough: BuildStream simply re-fetches
      # them from its remote cache, and a stale UKI embeds a composefs digest
      # bootc cannot reproduce at install time. --force rebuilds from source.
      - name: Rebuild boot artifacts from source (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        run: |
          just bst build --ignore-project-artifact-remotes \
            --artifact-remote invalid oci/mjolnir.bst

      - name: Build image locally (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        env:
          # Match the IMAGE value resolved below for PR runs.
          BUILD_IMAGE_NAME: localhost/mjolnir
        run: just build

      # Must match build.yml: the single large BuildStream layer cannot be read
      # by bootc's composefs backend ("Unexpected EOF in splitstream"). Rechunk
      # into the same update-friendly layers before the installer pulls it.
      - name: Rechunk image with chunkah (PR only)
        if: github.event_name == 'pull_request' || inputs.local_build
        uses: projectbluefin/actions/bootc-build/chunka@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        with:
          source-image: localhost/mjolnir:latest
          max-layers: "128"
          source-date-epoch: auto

      # Ubuntu runners do not ship QEMU or OVMF. The sealed UKI boots through
      # systemd-boot via UEFI, so both are required.
      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf mtools squashfs-tools xorriso systemd-boot-efi >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Log in as root: podman, skopeo and cosign then all find the credentials
      # in the same auth file. Not needed for PR builds (local image).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && !inputs.local_build
        env:
          REGISTRY_AUTH_FILE: /run/containers/0/auth.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | sudo podman login --authfile "$REGISTRY_AUTH_FILE" \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve image
        id: image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.local_build }}" = "true" ]; then
            ref="localhost/mjolnir:latest"
          else
            # GHCR requires a lowercase repository path; github.repository
            # preserves the account's mixed case (HuntedRaven7/Mjolnir).
            ref="${INPUT_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}:testing}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Compile the static installer as the runner user, where setup-go's PATH
      # is intact. The E2E script runs under sudo, whose PATH reset repeatedly
      # hid the Go toolchain from build-iso.sh.
      - name: Build static installer
        run: |
          set -euo pipefail
          # setup-go's PATH addition does not survive the later steps of this
          # job, so resolve the cached Go binary directly instead of relying
          # on PATH (plain `go` fails here with "command not found").
          GO_BIN="$(find /opt/hostedtoolcache/go -maxdepth 3 -type f \
            -path '*/bin/go' 2>/dev/null | sort -V | tail -n1 || true)"
          [ -n "$GO_BIN" ] || GO_BIN="$(command -v go || true)"
          [ -n "$GO_BIN" ] || { echo "go toolchain not found" >&2; exit 1; }
          echo "using $GO_BIN"
          "$GO_BIN" version
          mkdir -p build/prebuilt
          (cd installer && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            "$GO_BIN" build -trimpath -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/build/prebuilt/mjolnir-install" .)

      - name: Run E2E checks
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          INSTALLER_BIN: ${{ github.workspace }}/build/prebuilt/mjolnir-install
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY_AUTH_FILE: /run/containers/0/auth.json
          # A locally built PR image has no registry signature yet.
          SKIP_COSIGN: ${{ (github.event_name == 'pull_request' || inputs.local_build) && '1' || '0' }}
          # A locally built image is already in podman; do not registry-pull it.
          SKIP_PULL: ${{ (github.event_name == 'pull_request' || inputs.local_build) && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        # sudo -E is ignored on hosted runners; pass values explicitly instead.
        run: |
          # Pass PATH through sudo: setup-go puts the Go toolchain on the
          # runner user's PATH, but sudo resets it to secure_path, so the
          # installer ISO build (go build) would fail with "missing tool: go".
          sudo env PATH="${PATH}" \
            IMAGE="${IMAGE}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            INSTALLER_BIN="${INSTALLER_BIN}" \
            REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" \
            SKIP_PULL="${SKIP_PULL}" SKIP_COSIGN="${SKIP_COSIGN}" \
            GH_TOKEN="${GH_TOKEN}" GITHUB_ACTOR="${GITHUB_ACTOR}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            ./testsuite/e2e.sh

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: build/e2e/
          if-no-files-found: ignore
