name: e2e

# Boot/health/provenance gate, adapted from projectbluefin/testsuite's wrapper
# pattern. Drives our shell-less image over the serial console + Varlink instead
# of injecting an SSH user into a disposable disk copy.
#
# Runs after build has pushed :testing, not on the push itself: the two
# workflows used to start together, so e2e tried to pull an image that the
# build had not produced yet. It is intentionally NOT a required status check
# until it has passed reliably.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [testing]
  workflow_dispatch:
    inputs:
      image:
        description: "Image ref to test"
        type: string
        default: ghcr.io/huntedraven7/mjolnir:testing

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: boot + health + provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Test the harness from the commit that produced the image.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cosign

      # Ubuntu runners do not ship QEMU or OVMF. The sealed UKI boots through
      # systemd-boot via UEFI, so both are required.
      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The published :testing package is private, so an anonymous pull gets a
      # 403 on the bearer-token request. Log in as root: podman, skopeo and
      # cosign then all find the credentials in the same auth file.
      - name: Log in to GHCR
        env:
          REGISTRY_AUTH_FILE: /run/containers/0/auth.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | sudo podman login --authfile "$REGISTRY_AUTH_FILE" \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve image
        id: image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          # GHCR requires a lowercase repository path; github.repository
          # preserves the account's mixed case (HuntedRaven7/Mjolnir).
          ref="${INPUT_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}:testing}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run E2E checks
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY_AUTH_FILE: /run/containers/0/auth.json
        # sudo -E is ignored on hosted runners; pass values explicitly instead.
        run: |
          sudo env IMAGE="${IMAGE}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" \
            ./testsuite/e2e.sh

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-serial-log
          path: build/e2e/serial.log
          if-no-files-found: ignore
