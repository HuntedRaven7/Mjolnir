name: update-elements

on:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      allow_major:
        description: "Allow major-version bumps for git refs"
        type: boolean
        default: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Recompute pinned source hashes and refs
        env:
          ALLOW_MAJOR: ${{ inputs.allow_major }}
        run: |
          if [ "$ALLOW_MAJOR" = "true" ]; then
            python3 scripts/update_pins.py --allow-major
          else
            python3 scripts/update_pins.py
          fi
          git diff --stat

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-elements
          delete-branch: true
          title: "chore: update pinned element sources"
          body: |
            Automated weekly refresh of BuildStream source pins.

            `scripts/update_pins.py` recomputed the sha256 values and git refs
            from the version keys in `include/versions.yml`. Every download is
            verified. Review the diff, then let CI rebuild and validate.

            Patch/minor updates are eligible for auto-merge after CI passes;
            major bumps are left for manual review.
          labels: dependencies
          commit-message: "chore: update pinned element sources"
