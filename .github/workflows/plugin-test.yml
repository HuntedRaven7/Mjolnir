name: plugin-test

on:
  pull_request:
    branches: [testing]
  push:
    branches: [testing]
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: Console plugin smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: mjolnir-plugin

      - name: Run plugin smoke test
        run: ./testsuite/plugin-smoke.sh
