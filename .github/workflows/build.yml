name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
          cache: false
      - name: Static checks
        run: python3 tests/test_units.py
      - name: BuildStream graph
        run: just validate

  image:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Keep every Podman invocation in the same (root) store. `just` forwards
    # PODMAN to export, lint and the Python content checks; the push step below
    # uses the same store. Otherwise export writes to the rootless store and
    # "sudo podman push" cannot see the image.
    env:
      PODMAN: "sudo podman"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # projectbluefin/actions: runner and artifact-level helpers. The
      # dnf/Containerfile-specific actions are intentionally not used.
      - uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          install-tools: '["just", "cosign", "oras"]'

      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
          cache: false

      - name: Build and export image
        run: |
          just bst build oci/mjolnir.bst
          just export

      - name: Image content checks
        run: just test

      - name: bootc lint
        run: just lint

      - name: Export image for scanning
        run: sudo podman save --format docker-archive -o /tmp/scan-image.tar localhost/mjolnir:latest

      - name: Scan image
        uses: projectbluefin/actions/bootc-build/scan-image@v1
        continue-on-error: true
        with:
          input: /tmp/scan-image.tar
          severity-threshold: CRITICAL
          exit-code: '0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Rechunk the image into update-friendly OCI layers using the shared
      # action. The BuildStream/FSDK image has no RPM database, so we use the
      # buildah path (no fakecap xattr manifest) and skip
      # apply-pkg-intervals. force-compression stays false to keep the
      # ostree.components layer annotations intact.
      - name: Rechunk image with chunkah
        uses: projectbluefin/actions/bootc-build/chunka@v1
        with:
          source-image: localhost/mjolnir:latest
          max-layers: "128"
          source-date-epoch: auto

      # On merge queue, the pushed :testing image is the gate target; the E2E
      # job in e2e.yml runs as a separate required check against that ref.
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          # Use explicit docker:// transport. After chunka rechunks in place,
          # Podman can misparse the bare registry destination as a transport
          # name ("unknown transport ghcr.io/..."); the explicit prefix avoids
          # that, and resolving the source by immutable ID avoids stale tags.
          IMAGE_ID=$(sudo podman image inspect --format '{{.Id}}' localhost/mjolnir:latest)
          sudo podman push "containers-storage:${IMAGE_ID}" \
            "docker://ghcr.io/${{ github.repository_owner }}/mjolnir:latest"

      - name: Image size/layer budget
        run: python3 tests/test_image_budget.py

      - name: Sign and attest
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/mjolnir
          signing-mode: keyless
          # The BST-native SPDX SBOM is produced by the `sbom` job in quality.yml
          # (it captures junctioned FSDK sources that a syft scan cannot see).
          generate-sbom: 'false'
          push-attestation: 'true'
          # The action's default regexp only matches projectbluefin orgs; it
          # would fail to verify our own keyless signature.
          certificate-identity-regexp: '^https://github\.com/${{ github.repository_owner }}/Mjolnir/\.github/workflows/build\.yml@refs/heads/(main|gh-readonly-queue/main/.+)$'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: mjolnir

      - name: Prune old images
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@v1
        with:
          image-name: mjolnir
          github-token: ${{ secrets.GITHUB_TOKEN }}
