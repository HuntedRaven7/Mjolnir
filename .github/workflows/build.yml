name: build

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.24'
          cache: false
      - name: Static checks
        run: |
          python3 tests/test_units.py
          python3 tests/test_diagnostics.py
      # Checks the pinned FSDK config script, not the built kernel. VXLAN is an
      # accepted gap: Cilium asks for tunnel-protocol=vxlan but FSDK's config
      # does not enable it yet. The boot test must cover the loaded modules.
      - name: Cilium kernel config options
        run: python3 tests/test_kernel_config.py --known-gap VXLAN
      - name: BuildStream graph
        run: just validate

  image:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    # Keep every Podman invocation in the same (root) store. `just` forwards
    # PODMAN to export, lint and the Python content checks; the push step below
    # uses the same store. Otherwise export writes to the rootless store and
    # "sudo podman push" cannot see the image.
    env:
      PODMAN: "sudo podman"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR requires lowercase repository paths, but github.repository_owner
      # preserves the account's mixed case (HuntedRaven7). Compute a normalized
      # owner once for every registry reference; keep the original case for
      # the OIDC certificate identity, which mirrors the repository name.
      - name: Normalize registry owner
        run: echo "IMAGE_OWNER=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # projectbluefin/actions: runner and artifact-level helpers. The
      # dnf/Containerfile-specific actions are intentionally not used.
      - uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          install-tools: '["just", "cosign", "oras"]'

      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.24'
          cache: false

      # The BuildStream cache travels as a GHCR OCI artifact rather than via
      # actions/cache: the FSDK cache is many GB and GitHub's per-repo cache
      # limit is 10 GB, so it gets evicted and every run starts cold. GHCR
      # storage and bandwidth are free and uncapped. See scripts/bst-cache-oci.sh.
      # The public read-only caches in project.conf still cover upstream FSDK.
      - name: Restore BuildStream cache
        continue-on-error: true
        env:
          BST_CACHE_REF: ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir-cache
          BST_CACHE_KEY: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'include/versions.yml', 'elements/freedesktop-sdk.bst') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: just cache-pull

      - name: Build and export image
        id: build-image
        run: |
          just bst build oci/mjolnir.bst
          just export

      - name: Image content checks
        run: just test

      - name: bootc lint
        run: just lint

      - name: Export image for scanning
        run: sudo podman save --format docker-archive -o /tmp/scan-image.tar localhost/mjolnir:latest

      - name: Scan image
        uses: projectbluefin/actions/bootc-build/scan-image@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        continue-on-error: true
        with:
          input: /tmp/scan-image.tar
          severity-threshold: CRITICAL
          exit-code: '0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Rechunk the image into update-friendly OCI layers using the shared
      # action. The BuildStream/FSDK image has no RPM database, so we use the
      # buildah path (no fakecap xattr manifest) and skip
      # apply-pkg-intervals. force-compression stays false to keep the
      # ostree.components layer annotations intact.
      - name: Rechunk image with chunkah
        uses: projectbluefin/actions/bootc-build/chunka@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        with:
          source-image: localhost/mjolnir:latest
          max-layers: "128"
          source-date-epoch: auto

      # The pushed :testing image is the candidate for the manual :stable
      # promotion in execute-release.yml. Downstream jobs pull :testing after
      # this push, so the tag always exists by the time they run.
      # Compare the newly built image with the previously published :testing
      # image. Runs only on pushes to testing (not PRs) and before the push, so
      # the previous :testing digest is still the baseline.
      - name: Golden image diff
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          # just recipe parameters are positional; name=value would be passed
          # through as literal arguments instead of overriding the defaults.
          just image-diff "ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir:testing" \
            "localhost/mjolnir:latest" "image-diff.md"

      - name: Upload image diff
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mjolnir-image-diff
          path: image-diff.md
          retention-days: 90

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          # Use explicit docker:// transport. After chunka rechunks in place,
          # Podman can misparse the bare registry destination as a transport
          # name ("unknown transport ghcr.io/..."); the explicit prefix avoids
          # that, and resolving the source by immutable ID avoids stale tags.
          IMAGE_ID=$(sudo podman image inspect --format '{{.Id}}' localhost/mjolnir:latest)
          IMAGE="ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir"
          # :testing is the stream tag promoted to :stable on release. :latest
          # stays as a compatibility alias for existing consumers.
          sudo podman push --digestfile /tmp/mjolnir-digest.txt \
            "containers-storage:${IMAGE_ID}" "docker://${IMAGE}:testing"
          sudo podman push "containers-storage:${IMAGE_ID}" "docker://${IMAGE}:latest"
          DIGEST=$(cat /tmp/mjolnir-digest.txt)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mjolnir-digest
          path: /tmp/mjolnir-digest.txt
          retention-days: 90

      - name: Image size/layer budget
        run: python3 tests/test_image_budget.py

      - name: Sign and attest
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/sign-and-publish@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        with:
          image: ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          # The BST-native SPDX SBOM is produced by the `sbom` job in quality.yml
          # (it captures junctioned FSDK sources that a syft scan cannot see).
          generate-sbom: 'false'
          push-attestation: 'true'
          # The action's default regexp only matches projectbluefin orgs; it
          # would fail to verify our own keyless signature.
          certificate-identity-regexp: '^https://github\.com/${{ github.repository_owner }}/Mjolnir/\.github/workflows/build\.yml@refs/heads/(testing|gh-readonly-queue/testing/.+)$'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: mjolnir

      - name: Prune old images
        if: github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        with:
          # This action forwards `packages`, not `image-name`. Without it the
          # underlying cleanup action falls back to github.repository.name
          # ("Mjolnir", mixed case) and GHCR returns 404.
          packages: mjolnir
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is written even when the build failed — what it built is what
      # the next run should not repeat. The graph-keyed tag is written only for
      # a complete build, so a partial cache never claims to be complete.
      - name: Save BuildStream cache
        if: always()
        continue-on-error: true
        env:
          BST_CACHE_REF: ghcr.io/${{ env.IMAGE_OWNER }}/mjolnir-cache
          BST_CACHE_KEY: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'include/versions.yml', 'elements/freedesktop-sdk.bst') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ "${{ steps.build-image.outcome }}" != "success" ]; then
            unset BST_CACHE_KEY
          fi
          just cache-push

  # Check what can be checked for aarch64 without compiling: the committed
  # arm64 varlink pin, upstream availability of every arm64 source pin, and the
  # aarch64 element graph. Verified: pins exist, URLs serve, graph resolves.
  # NOT verified: sha256 at fetch (BuildStream does that in a real build),
  # compilation, linking, an aarch64 OCI image, or boot. A full cross-build is
  # not possible with the pinned bst2 image: buildbox-run reports
  # "ISA 'aarch64' is not supported by buildbox-run" as soon as an element
  # needs to compile locally. That needs a remote-execution worker or an
  # aarch64 runner, neither of which this repo has yet. See docs/BUILD.md.
  validate-arm64:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check committed arm64 pins
        run: python3 tests/test_pins.py

      - name: Check arm64 source availability
        run: python3 tests/test_arm64_pins.py

      - name: Resolve aarch64 element graph
        run: just bst -o arch aarch64 show oci/mjolnir.bst
