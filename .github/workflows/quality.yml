name: quality

on:
  pull_request:
    branches: [testing]
  schedule:
    - cron: "23 5 * * 1"   # weekly reproducibility check
  workflow_dispatch:

permissions: {}

# The golden image diff now runs as part of build.yml on pushes to testing,
# against the previously published :testing image. It no longer runs on PRs.

jobs:
  reproducibility:
    name: Reproducibility
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build twice and compare
        run: just repro

  sbom:
    name: BST-native SPDX SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cosign,oras
      - name: Generate SBOM
        run: just sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mjolnir-spdx
          path: sbom_out/mjolnir.spdx.json
