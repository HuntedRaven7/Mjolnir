name: mjolnir

min-version: 2.5

element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml
  - include/versions.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  branch: main
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        efi-arch: "x64"
    - arch == "aarch64":
        go-arch: "arm64"
        efi-arch: "aa64"

# Pull-only caches. All artifacts are rebuilt locally if a cache miss occurs;
# nothing in this project pushes to a shared cache (signing keys must stay local).
artifacts:
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - make
      - cmake
    sources:
      - patch
      - docker
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - git_repo
      - patch_queue
      - cargo2

sources:
  git_repo:
    config:
      ref-format: git-describe

source-caches:
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
